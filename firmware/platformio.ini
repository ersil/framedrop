; PlatformIO Project Configuration File
;
; Target hardware: ESP32-S3-DevKitC-1 clone
;   ESP32-S3 rev v0.2, 4 MB quad flash, no PSRAM (verified with esptool flash_id).
;
; Environments:
;   photoframe - the product: USB mass storage + Wi-Fi web UI served from LittleFS
;   msc       - USB mass storage only, no networking
;   diag/scan - SD card diagnostics, keep the native port in Serial/JTAG mode so
;               the board stays flashable over COM11 while testing wiring
;   ramdisk   - RAM-backed FAT12 volume, proves USB MSC without the SD card

[platformio]
default_envs = photoframe

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 4 MB flash, no PSRAM. The stock board definition assumes 8 MB, which places
; the partition table past the end of this chip's flash.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_printdrop.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
lib_deps =
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^7.0.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; SD card wiring (ESP32-S3 GPIO numbers)
;
; SPI (legacy, 4 wires) and SDIO 4-bit (feat/sdio, 6 wires) share the same
; physical breakout — SDIO reuses the four SPI pins plus two new data lines:
;   SPI : CS=12 MISO=39 MOSI=14 CLK=40
;   SDIO: CLK=40 CMD=14 D0=39 D1=12 D2=13 D3=15
; SDIO requires a 3.3 V-native microSD breakout (no AMS1117/LC125) with 10 k
; pull-ups on CMD and D0-D3. See docs/hardware.md.
build_flags =
	-D SD_CS_PIN=12
	-D SD_MISO_PIN=39
	-D SD_MOSI_PIN=14
	-D SD_CLK_PIN=40
	-D SDMMC_CLK_PIN=40
	-D SDMMC_CMD_PIN=14
	-D SDMMC_D0_PIN=39
	-D SDMMC_D1_PIN=12
	-D SDMMC_D2_PIN=13
	-D SDMMC_D3_PIN=15
	-D SDMMC_FREQ=40000000

; --- Diagnostic ---------------------------------------------------------------
; ARDUINO_USB_MODE=1 keeps the hardware USB-Serial-JTAG peripheral, so the native
; port stays COM11 and esptool can always reach the chip.
[env:diag]
build_src_filter = -<*> +<diag/sd_diag.cpp>
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	${env.build_flags}
upload_protocol = esptool
upload_port = COM11
monitor_port = COM11

; --- Wiring scanner -----------------------------------------------------------
; Bit-bangs the SD init sequence over swept pin assignments to locate a card
; that does not answer on the configured pins.
[env:scan]
build_src_filter = -<*> +<diag/sd_scan.cpp>
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	${env.build_flags}
upload_protocol = esptool
upload_port = COM11
monitor_port = COM11

; --- USB mass storage ---------------------------------------------------------
; ARDUINO_USB_MODE=0 hands the native USB port to TinyUSB, which is what makes
; USBMSC enumerate.
;
; CDC_ON_BOOT must stay 0. USB.h defines ARDUINO_USB_ON_BOOT from it, and the
; core's app_main() then calls USB.begin() before setup() runs -- freezing the
; USB descriptor before the sketch can add the MSC interface or set its own PID.
; With CDC off, USB.begin() happens in setup() where it belongs.
; Console output goes to UART0 on COM5 instead.
[env:msc]
build_src_filter = -<*> +<legacy/msc_only.cpp>
; Replaces the board definition's flags wholesale. The stock list hard-codes
; -DARDUINO_USB_MODE=1, which compiles USBMSC out entirely; appending a second
; -D would only produce a macro-redefinition warning.
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	${env.build_flags}
upload_protocol = esptool
upload_port = COM11
monitor_port = COM5

; --- USB MSC self-test --------------------------------------------------------
; Exposes a RAM-backed FAT12 volume. Proves USB mass storage works on this board
; without involving the SD card at all.
[env:ramdisk]
build_src_filter = -<*> +<diag/msc_ramdisk.cpp>
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	${env.build_flags}
upload_protocol = esptool
upload_port = COM11
monitor_port = COM5

; --- SDIO diagnostics ----------------------------------------------------------
; 4-bit SDMMC bring-up: card detect, bus width test, throughput sweep.
[env:diag_sdio]
build_src_filter = -<*> +<diag/sd_diag.cpp>
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	${env.build_flags}
	-D USE_SDIO
	-D SDMMC_WIDTH=4
upload_protocol = esptool
upload_port = COM11
monitor_port = COM11

; --- SDIO throughput benchmark -------------------------------------------------
; Measures what docs/sdio.md projected. USB stays in Serial/JTAG mode so the
; board remains flashable over the native port while benchmarking.
[env:bench_sdio]
build_src_filter = -<*> +<diag/sdio_bench.cpp>
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	${env.build_flags}
	-D USE_SDIO
	-D SDMMC_WIDTH=4
upload_protocol = esptool

; --- SD core-affinity test -----------------------------------------------------
; Measures whether SD transfers are CPU-bound (a dedicated core would help) or
; DMA/latency-bound (it would not).
[env:core_sdio]
build_src_filter = -<*> +<diag/sdio_core_bench.cpp>
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	${env.build_flags}
	-D USE_SDIO
	-D SDMMC_WIDTH=4
upload_protocol = esptool

; --- Photo frame (ESP32-S3 SuperMini) -----------------------------------------
; The fork's own target: a 2018 NIX digital photo frame on the native USB port.
; ESP32-S3 SuperMini, 4 MB embedded flash, 2 MB embedded PSRAM (unused).
;
; Differences from upstream PrintDrop's printdrop environment (removed here):
;   * SD on SPI (GPIO 4-7). The SuperMini exposes GPIO 1-13 on its headers.
;     SDIO is not used: SPI is fast enough for photos over USB full speed.
;   * USB_FORCE_REATTACH=0: uploads are batched, the drive stays connected,
;     and the medium is pulsed once when a batch ends. With 1 the device drops
;     off the USB bus for the batch instead.
;   * No discrete LED (the SuperMini's LED on GPIO48 is a WS2812, which
;     digitalWrite cannot drive). The BOOT button on GPIO0 is the button.
;   * No UART bridge, so there is no serial console. Provision over the setup
;     access point; recover with BOOT held at reset.
;   * Web password hash and setup-network password come from the environment
;     via tools/build_secrets.py (a generated, force-included header); the build
;     fails without them.
[env:photoframe]
build_src_filter = -<*> +<printdrop/>
board_build.partitions = partitions_printdrop_ota.csv
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
extra_scripts = pre:tools/build_secrets.py
build_flags =
	-D SD_CLK_PIN=4
	-D SD_MOSI_PIN=5
	-D SD_MISO_PIN=6
	-D SD_CS_PIN=7
	-D USB_FORCE_REATTACH=0
	-D PRINTDROP_NAME=\"PhotoFrame\"
	-D PRINTDROP_VERSION=\"0.2.1-photoframe.15\"
	-D DEFAULT_HOSTNAME=\"photoframe\"
	-D AP_SSID_PREFIX=\"PhotoFrame-Setup\"
	-D PRINTDROP_AUTH_USER=\"admin\"
	-D PRINTDROP_LED_PIN=-1
	-D PRINTDROP_BUTTON_PIN=0
	-D PRINTDROP_BUTTON_ACTIVE_LOW=1
upload_protocol = esptool

; --- Photo frame SD wiring check ----------------------------------------------
; Upstream's SPI SD diagnostic on the photoframe pins. USB stays in Serial/JTAG
; mode, so the board keeps a serial console on its only port and stays
; flashable without BOOT. Flash this first after wiring the breakout, read the
; report with `pio device monitor`, then flash the photoframe environment.
[env:photoframe_sd_diag]
build_src_filter = -<*> +<diag/sd_diag.cpp>
; Same partition table as photoframe, so flashing the diagnostic and then
; the firmware leaves the UI image and OTA slots where they are.
board_build.partitions = partitions_printdrop_ota.csv
board_build.extra_flags =
	-DARDUINO_ESP32S3_DEV
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
	-D SD_CLK_PIN=4
	-D SD_MOSI_PIN=5
	-D SD_MISO_PIN=6
	-D SD_CS_PIN=7
upload_protocol = esptool
